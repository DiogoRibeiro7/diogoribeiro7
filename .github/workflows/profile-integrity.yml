name: Profile integrity

on:
  pull_request:
    paths:
      - "*.md"
      - "data/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate committed manifest-backed pages
        run: |
          python scripts/validate_portfolio_schema.py
          python scripts/profile_maintenance.py check
          python scripts/sync_readme_snapshot.py check
          python scripts/sync_projects_index.py check
          python scripts/sync_statistics.py check

      - name: Verify deterministic generated assets are committed
        run: |
          python scripts/generate_portfolio_overview.py
          python scripts/generate_topic_statistics.py
          git diff --exit-code -- assets/portfolio-overview.svg assets/topic-statistics.svg

      # External repository evidence changes independently of this pull request.
      # Keep the live audit available on explicit workflow dispatch.
      - name: Validate flagship engineering controls
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_portfolio_metrics.py check

      - name: Validate most-starred repository table
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/generate_star_metrics.py check

      - name: Check public GitHub and PyPI inventory
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_external_inventory.py

      - name: Test deterministic portfolio generators
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile scripts/validate_portfolio_schema.py scripts/profile_maintenance.py scripts/normalize_readme_layout.py scripts/sync_readme_snapshot.py scripts/sync_projects_index.py scripts/check_external_inventory.py scripts/generate_portfolio_overview.py scripts/generate_topic_statistics.py scripts/generate_portfolio_metrics.py scripts/sync_statistics.py scripts/generate_star_metrics.py
