name: Profile maintenance

on:
  schedule:
    # Weekly refresh so star counts and audits do not go stale between profile edits.
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - "data/portfolio.json"
      - "PROJECTS.md"
      - "README.md"
      - "METHODS.md"
      - "RESEARCH.md"
      - "TEACHING.md"
      - "STATISTICS.md"
      - "scripts/profile_maintenance.py"
      - "scripts/normalize_readme_layout.py"
      - "scripts/generate_topic_statistics.py"
      - "scripts/generate_portfolio_metrics.py"
      - "scripts/generate_portfolio_overview.py"
      - "scripts/sync_statistics.py"
      - "scripts/generate_star_metrics.py"
      - ".github/workflows/profile-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-maintenance-main
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate manifest-backed pages and navigation
        run: python scripts/profile_maintenance.py generate

      - name: Normalize README layout
        run: python scripts/normalize_readme_layout.py

      - name: Regenerate portfolio-wide statistics
        run: python scripts/generate_portfolio_overview.py

      - name: Regenerate topic statistics
        run: python scripts/generate_topic_statistics.py

      - name: Synchronise Statistics tables
        run: python scripts/sync_statistics.py generate

      - name: Refresh most-starred repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_star_metrics.py generate

      - name: Regenerate flagship engineering controls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_portfolio_metrics.py generate

      - name: Validate generated state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/profile_maintenance.py check
          python scripts/sync_statistics.py check
          python scripts/generate_portfolio_metrics.py check
          python scripts/generate_star_metrics.py check

      - name: Commit refreshed profile artifacts
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Profile artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md FEATURED.md PROJECTS.md METHODS.md RESEARCH.md OUTPUTS.md CASE_STUDIES.md TEACHING.md PYPI.md STATISTICS.md assets/
          git commit -m "chore: refresh generated profile artifacts"
          git pull --rebase origin main
          git push
