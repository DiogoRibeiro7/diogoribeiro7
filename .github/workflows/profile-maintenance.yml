name: Profile maintenance

on:
  schedule:
    # Weekly refresh so star counts and audits do not go stale between profile edits.
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - "*.md"
      - "data/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/profile-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-maintenance-main
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate canonical portfolio schema
        run: python scripts/validate_portfolio_schema.py

      - name: Regenerate manifest-backed pages and navigation
        run: python scripts/profile_maintenance.py generate

      - name: Normalize README layout
        run: python scripts/normalize_readme_layout.py

      - name: Synchronise README portfolio snapshot
        run: python scripts/sync_readme_snapshot.py generate

      - name: Synchronise Projects public index
        run: python scripts/sync_projects_index.py generate

      - name: Regenerate portfolio-wide statistics
        run: python scripts/generate_portfolio_overview.py

      - name: Regenerate topic statistics
        run: python scripts/generate_topic_statistics.py

      - name: Synchronise Statistics tables
        run: python scripts/sync_statistics.py generate

      - name: Refresh most-starred repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_star_metrics.py generate

      - name: Regenerate flagship engineering controls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_portfolio_metrics.py generate

      - name: Validate generated and public state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/profile_maintenance.py check
          python scripts/sync_readme_snapshot.py check
          python scripts/sync_projects_index.py check
          python scripts/sync_statistics.py check
          python scripts/generate_portfolio_metrics.py check
          python scripts/generate_star_metrics.py check
          python scripts/check_external_inventory.py

      # GITHUB_TOKEN-created PRs do not trigger ordinary pull_request workflows.
      # Validate the generated tree here before proposing it for review.
      - name: Run offline profile regression tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Validate proposed generated assets
        run: |
          python scripts/validate_portfolio_schema.py
          python scripts/profile_maintenance.py check
          python scripts/sync_readme_snapshot.py check
          python scripts/sync_projects_index.py check
          python scripts/sync_statistics.py check
          python scripts/generate_portfolio_overview.py
          python scripts/generate_topic_statistics.py

      - name: Propose refreshed profile artifacts
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh generated profile artifacts"
          branch: automation/refresh-profile-artifacts
          delete-branch: true
          title: "chore: refresh generated profile artifacts"
          body: |
            Automated profile refresh from the canonical portfolio manifest and external repository metrics.

            Please review generated Markdown and SVG changes before merging.
          add-paths: |
            README.md
            FEATURED.md
            PROJECTS.md
            METHODS.md
            RESEARCH.md
            OUTPUTS.md
            CASE_STUDIES.md
            TEACHING.md
            PYPI.md
            STATISTICS.md
            assets/**
