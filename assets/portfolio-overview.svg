<text x="632" y="162" class="note">end-to-end problem → method → outcome narratives</text>
<rect x="24" y="202" width="278" height="102" rx="10" class="card"/>
<text x="40" y="227" class="label">Real-data / empirical</text>
<text x="40" y="259" class="value">23/38 · 61%</text>
<text x="40" y="282" class="note">explicit manifest classification</text>
<rect x="320" y="202" width="278" height="102" rx="10" class="card"/>
<text x="336" y="227" class="label">Research software / methods</text>
