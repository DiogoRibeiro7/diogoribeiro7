<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 799" role="img" aria-labelledby="title desc">
<title id="title">Portfolio-wide evidence dashboard</title>
<desc id="desc">Statistics across 38 manifest-backed public projects, 35 outputs and 13 case studies.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c9d1d9}
.title{font-size:23px;font-weight:700}.sub{font-size:13px;fill:#8b949e}
.card{fill:#161b22;stroke:#30363d}.label{font-size:13px;font-weight:600}.value{font-size:23px;font-weight:700;fill:#58a6ff}.note{font-size:10.5px;fill:#8b949e}
.track{fill:#21262d}.bar{fill:#58a6ff}.maturity{font-size:13px}
@media (prefers-color-scheme: light){text{fill:#24292f}.sub,.note{fill:#57606a}.card{fill:#f6f8fa;stroke:#d0d7de}.track{fill:#d8dee4}.bar,.value{fill:#0969da}}
</style>
<text x="24" y="31" class="title">Portfolio-wide evidence</text>
<text x="24" y="54" class="sub">Canonical manifest · 38 public projects · derived metrics, not popularity signals</text>
<rect x="24" y="82" width="278" height="102" rx="10" class="card"/>
<text x="40" y="107" class="label">Manifest-backed projects</text>
<text x="40" y="139" class="value">38</text>
<text x="40" y="162" class="note">public projects with explicit portfolio metadata</text>
<rect x="320" y="82" width="278" height="102" rx="10" class="card"/>
<text x="336" y="107" class="label">Substantial outputs</text>
<text x="336" y="139" class="value">35</text>
<text x="336" y="162" class="note">software, research, empirical and decision artifacts</text>
<rect x="616" y="82" width="278" height="102" rx="10" class="card"/>
<text x="632" y="107" class="label">Case studies</text>
