<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 826" role="img" aria-labelledby="title desc">
<title id="title">Portfolio-wide evidence dashboard</title>
<desc id="desc">Statistics across 35 manifest-backed public projects, 32 outputs and 13 case studies.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c9d1d9}.title{font-size:23px;font-weight:700}.sub{font-size:13px;fill:#8b949e}.card{fill:#161b22;stroke:#30363d}.label{font-size:13px;font-weight:600}.value{font-size:23px;font-weight:700;fill:#58a6ff}.note{font-size:10.5px;fill:#8b949e}.track{fill:#21262d}.bar{fill:#58a6ff}.maturity{font-size:13px}@media (prefers-color-scheme: light){text{fill:#24292f}.sub,.note{fill:#57606a}.card{fill:#f6f8fa;stroke:#d0d7de}.track{fill:#d8dee4}.bar,.value{fill:#0969da}}
</style>
<text x="24" y="31" class="title">Portfolio-wide evidence</text>
<text x="24" y="54" class="sub">Canonical manifest · 35 public projects · derived metrics, not popularity signals</text>
<rect x="24" y="82" width="278" height="102" rx="10" class="card"/><text x="40" y="107" class="label">Manifest-backed projects</text><text x="40" y="139" class="value">35</text><text x="40" y="162" class="note">public projects with explicit portfolio metadata</text>
<rect x="320" y="82" width="278" height="102" rx="10" class="card"/><text x="336" y="107" class="label">Substantial outputs</text><text x="336" y="139" class="value">32</text><text x="336" y="162" class="note">software, research, empirical and decision artifacts</text>
<rect x="616" y="82" width="278" height="102" rx="10" class="card"/><text x="632" y="107" class="label">Case studies</text><text x="632" y="139" class="value">13 · 11 domains</text><text x="632" y="162" class="note">end-to-end problem → method → outcome narratives</text>
<rect x="24" y="202" width="278" height="102" rx="10" class="card"/><text x="40" y="227" class="label">Real-data / empirical</text><text x="40" y="259" class="value">23/35 · 66%</text><text x="40" y="282" class="note">explicit manifest classification</text>
<rect x="320" y="202" width="278" height="102" rx="10" class="card"/><text x="336" y="227" class="label">Research software / methods</text><text x="336" y="259" class="value">11/35 · 31%</text><text x="336" y="282" class="note">explicit manifest classification</text>
<rect x="616" y="202" width="278" height="102" rx="10" class="card"/><text x="632" y="227" class="label">Published PyPI packages</text><text x="632" y="259" class="value">8</text><text x="632" y="282" class="note">verified package releases</text>
<rect x="24" y="322" width="278" height="102" rx="10" class="card"/><text x="40" y="347" class="label">Curated flagships</text><text x="40" y="379" class="value">12</text><text x="40" y="402" class="note">reviewer-oriented subset, not the main denominator</text>
<text x="24" y="468" class="label">Maturity mix</text><text x="24" y="489" class="sub">Counts are mutually exclusive manifest labels; topic and maturity are separate dimensions.</text>
<text x="24" y="537" class="maturity">published software</text><rect x="260" y="523" width="600" height="17" rx="8.5" class="track"/><rect x="260" y="523" width="600" height="17" rx="8.5" class="bar"/><text x="896" y="537" text-anchor="end" class="label">8</text>
<text x="24" y="568" class="maturity">empirical study</text><rect x="260" y="554" width="600" height="17" rx="8.5" class="track"/><rect x="260" y="554" width="600" height="17" rx="8.5" class="bar"/><text x="896" y="568" text-anchor="end" class="label">8</text>
<text x="24" y="599" class="maturity">production-style system</text><rect x="260" y="585" width="600" height="17" rx="8.5" class="track"/><rect x="260" y="585" width="525" height="17" rx="8.5" class="bar"/><text x="896" y="599" text-anchor="end" class="label">7</text>
<text x="24" y="630" class="maturity">research programme</text><rect x="260" y="616" width="600" height="17" rx="8.5" class="track"/><rect x="260" y="616" width="300" height="17" rx="8.5" class="bar"/><text x="896" y="630" text-anchor="end" class="label">4</text>
<text x="24" y="661" class="maturity">decision system</text><rect x="260" y="647" width="600" height="17" rx="8.5" class="track"/><rect x="260" y="647" width="225" height="17" rx="8.5" class="bar"/><text x="896" y="661" text-anchor="end" class="label">3</text>
<text x="24" y="692" class="maturity">research software</text><rect x="260" y="678" width="600" height="17" rx="8.5" class="track"/><rect x="260" y="678" width="150" height="17" rx="8.5" class="bar"/><text x="896" y="692" text-anchor="end" class="label">2</text>
<text x="24" y="723" class="maturity">replication study</text><rect x="260" y="709" width="600" height="17" rx="8.5" class="track"/><rect x="260" y="709" width="75" height="17" rx="8.5" class="bar"/><text x="896" y="723" text-anchor="end" class="label">1</text>
<text x="24" y="754" class="maturity">decision study</text><rect x="260" y="740" width="600" height="17" rx="8.5" class="track"/><rect x="260" y="740" width="75" height="17" rx="8.5" class="bar"/><text x="896" y="754" text-anchor="end" class="label">1</text>
<text x="24" y="785" class="maturity">research portfolio</text><rect x="260" y="771" width="600" height="17" rx="8.5" class="track"/><rect x="260" y="771" width="75" height="17" rx="8.5" class="bar"/><text x="896" y="785" text-anchor="end" class="label">1</text>
</svg>
